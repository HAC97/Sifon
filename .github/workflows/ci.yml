name: CI

# Deterministic checks only: no real sites, no downloads of real content.
# Evaluations against real services live in evals.yml and never gate a merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, API contract and browser (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/downloader/requirements-dev.txt

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: python -m pip install -r services/downloader/requirements-dev.txt

      - name: PowerShell scripts parse
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in (Get-ChildItem scripts/*.ps1, packaging/*.ps1)) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "$($file.Name): $_" }; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Gate tests (local, no network)
        run: python -m pytest services/downloader/tests -q

      - name: API contract is up to date
        run: |
          python scripts/gen_contract.py
          git diff --exit-code -- contracts/api.openapi.json

      - name: Browser tests
        run: |
          python -m playwright install chromium
          python -m pytest services/downloader/tests/e2e -m e2e -q

  install-smoke:
    name: Install from scratch and start (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: install.cmd
        shell: cmd
        run: install.cmd

      - name: Start with run.cmd and read /api/health
        shell: powershell
        run: |
          $server = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'run.cmd', '-Port', '8765', '-NoBrowser' -PassThru -RedirectStandardOutput run.out -RedirectStandardError run.err
          $health = $null
          for ($i = 0; $i -lt 60 -and -not $health; $i++) {
            Start-Sleep -Seconds 1
            try { $health = Invoke-RestMethod http://127.0.0.1:8765/api/health -TimeoutSec 2 } catch {}
          }
          Get-Content run.out, run.err
          if (-not $health -or -not $health.ok) { throw 'the server did not answer /api/health' }
          $health | ConvertTo-Json
          if (-not $health.ffmpeg) { throw 'health says ffmpeg is missing' }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*uvicorn*8765*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }

  package:
    name: Windows package (exe, portable ZIP, installer)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      # Deliberately NO ffmpeg, deno or node install: the package must bring its own.
      - name: Install build dependencies and Inno Setup
        run: |
          python -m pip install -r packaging/requirements-build.txt
          .\packaging\install_innosetup.ps1

      - name: Build exe, portable ZIP and installer
        run: python packaging/build.py --installer --iscc $env:ISCC

      - name: Smoke test the unpacked package (clean PATH, offline)
        shell: powershell
        run: |
          $src = python -c "import yt_dlp, pathlib; print(pathlib.Path(yt_dlp.__file__).resolve().parent.parent)"
          python packaging/smoke_test.py dist/sifon --ytdlp-src $src
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install, smoke test and uninstall the installer
        shell: powershell
        run: |
          $src = python -c "import yt_dlp, pathlib; print(pathlib.Path(yt_dlp.__file__).resolve().parent.parent)"
          $setup = (Get-ChildItem dist/sifon-*-setup.exe).FullName
          .\packaging\test_installer.ps1 -Setup $setup -Python python -YtdlpSrc $src
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-package
          path: |
            dist/sifon-*-setup.exe
            dist/sifon-*-windows-portable.zip
            dist/SHA256SUMS.txt
          retention-days: 7
