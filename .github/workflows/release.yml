name: Release (Windows package)

# Runs when a version tag is pushed (v0.2.0, ...). Builds the installer and the portable ZIP,
# tests them, and attaches them to the GitHub release of that tag. If the release does not
# exist yet, a DRAFT is created so a person reviews the notes before publishing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      - name: Install build dependencies and Inno Setup
        run: |
          python -m pip install -r packaging/requirements-build.txt
          choco install innosetup -y --no-progress

      - name: The tag must match the app version
        shell: powershell
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'services/downloader'); from app import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match app version $version" }

      - name: Build
        run: python packaging/build.py --installer

      - name: Smoke test, offline and with a real download
        shell: powershell
        run: |
          $src = python -c "import yt_dlp, pathlib; print(pathlib.Path(yt_dlp.__file__).resolve().parent.parent)"
          python packaging/smoke_test.py dist/sifon --ytdlp-src $src --online
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Installer test
        shell: powershell
        run: |
          $src = python -c "import yt_dlp, pathlib; print(pathlib.Path(yt_dlp.__file__).resolve().parent.parent)"
          $setup = (Get-ChildItem dist/sifon-*-setup.exe).FullName
          .\packaging\test_installer.ps1 -Setup $setup -Python python -YtdlpSrc $src
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Attach to the release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --draft --title "sifón $tag" --notes "Borrador creado por el flujo de publicación: revisar las notas antes de publicar. Ver CHANGELOG.md."
          }
          gh release upload $tag (Get-ChildItem dist/sifon-*-setup.exe).FullName (Get-ChildItem dist/sifon-*-windows-portable.zip).FullName dist/SHA256SUMS.txt --clobber
