name: Canary (latest yt-dlp)

# yt-dlp and the sites it reads change constantly. Once a week this builds the package with the
# newest dependencies and runs the offline and real-download smoke tests. It publishes nothing:
# a red run is the early warning that the next release (or the in-app updater) needs attention.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"

permissions:
  contents: read

jobs:
  canary:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies with the newest yt-dlp
        run: |
          python -m pip install -r packaging/requirements-build.txt
          python -m pip install --upgrade --upgrade-strategy eager "yt-dlp[default,curl-cffi]"
          python scripts/check_env.py --versions

      - name: Build the package (no installer)
        run: python packaging/build.py

      - name: Smoke test with a real download
        shell: powershell
        run: |
          $src = python -c "import yt_dlp, pathlib; print(pathlib.Path(yt_dlp.__file__).resolve().parent.parent)"
          python packaging/smoke_test.py dist/sifon --ytdlp-src $src --online
          if ($LASTEXITCODE -ne 0) { exit 1 }
