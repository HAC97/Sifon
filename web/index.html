<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>sifón</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="brand">
      <svg class="logo" viewBox="0 0 64 64" width="36" height="36" aria-hidden="true" focusable="false">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path class="w b1" stroke-width="7" d="M8 24v8"/>
          <path class="w b2" stroke-width="7" d="M20 17v22"/>
          <path class="a b3" stroke-width="7" d="M32 7v36"/>
          <path class="w b4" stroke-width="7" d="M44 17v22"/>
          <path class="w b5" stroke-width="7" d="M56 24v8"/>
          <path class="a b6" stroke-width="5.5" d="M23 49l9 8 9-8"/>
        </g>
      </svg>
      <span class="name">sifón</span>
    </header>

    <h1>Sacá el video o el audio de cualquier enlace</h1>
    <p class="sub">La app corre en tu compu y los archivos quedan ahí.</p>

    <form id="url-form" class="drop" autocomplete="off">
      <input id="url" type="url" placeholder="Pegá el enlace del video" required aria-label="Enlace del video">
      <button id="paste" class="btn ghost" type="button">Pegar</button>
      <button id="fetch" class="btn primary" type="submit">Buscar</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <section id="card" class="card" aria-label="Video encontrado" hidden>
      <img id="thumb" class="thumb" alt="" referrerpolicy="no-referrer" hidden>
      <div class="meta">
        <h2 id="title"></h2>
        <p id="byline"></p>
      </div>

      <div class="opts">
        <div class="seg" role="radiogroup" aria-label="Tipo de descarga">
          <label><input type="radio" name="mode" value="video" checked><span>Video</span></label>
          <label><input type="radio" name="mode" value="audio"><span>Solo audio</span></label>
        </div>

        <label id="video-opt" class="field">Calidad
          <select id="height"></select>
        </label>
        <label id="audio-opt" class="field" hidden>Formato
          <select id="audio-format">
            <option value="mp3">MP3</option>
            <option value="m4a">M4A</option>
            <option value="opus">Opus</option>
          </select>
        </label>
      </div>

      <button id="download" class="btn primary wide" type="button">Descargar</button>

      <div id="progress" class="run" hidden>
        <div class="readout">
          <div class="pct" aria-hidden="true"><span id="pct">0</span><small>%</small></div>
          <div class="state">
            <p id="status" class="status" role="status"></p>
            <p id="detail" class="detail" aria-hidden="true"></p>
          </div>
        </div>
        <progress id="bar" max="100" value="0" aria-label="Progreso de la descarga"></progress>
        <button id="again" class="btn ghost" type="button" hidden>Descargar otra vez</button>
      </div>
    </section>

    <footer class="foot">Bajá solo lo que tengas derecho a bajar y respetá los términos de cada sitio.</footer>
  </main>
  <noscript>Esta página necesita JavaScript.</noscript>
  <script src="app.js"></script>
</body>
</html>
